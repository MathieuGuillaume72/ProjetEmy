<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE7C7"/>
      <stop offset="100%" stop-color="#F4C28A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B6E3A"/>
      <stop offset="100%" stop-color="#6E4E26"/>
    </linearGradient>
    <linearGradient id="insul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD96A"/>
      <stop offset="100%" stop-color="#E0A847"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>

  <!-- Roof beams (rafters) -->
  <g transform="translate(0,80)">
    <polygon points="100,300 450,40 800,300 800,330 450,80 100,330" fill="url(#wood)"/>
    <!-- Vertical beams -->
    <rect x="200" y="120" width="22" height="240" fill="url(#wood)"/>
    <rect x="320" y="80" width="22" height="280" fill="url(#wood)"/>
    <rect x="450" y="60" width="22" height="300" fill="url(#wood)"/>
    <rect x="580" y="80" width="22" height="280" fill="url(#wood)"/>
    <rect x="700" y="120" width="22" height="240" fill="url(#wood)"/>
  </g>

  <!-- Insulation rolls between beams -->
  <g>
    <!-- Roll 1 -->
    <g transform="translate(230,260)">
      <rect width="90" height="180" rx="8" fill="url(#insul)" stroke="#B8852E" stroke-width="2"/>
      <line x1="0" y1="20" x2="90" y2="20" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="40" x2="90" y2="40" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="60" x2="90" y2="60" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="80" x2="90" y2="80" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="100" x2="90" y2="100" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="120" x2="90" y2="120" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="140" x2="90" y2="140" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="160" x2="90" y2="160" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
    </g>
    <g transform="translate(350,220)">
      <rect width="90" height="220" rx="8" fill="url(#insul)" stroke="#B8852E" stroke-width="2"/>
      <line x1="0" y1="30" x2="90" y2="30" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="60" x2="90" y2="60" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="90" x2="90" y2="90" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="120" x2="90" y2="120" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="150" x2="90" y2="150" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="180" x2="90" y2="180" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
    </g>
    <g transform="translate(480,200)">
      <rect width="90" height="240" rx="8" fill="url(#insul)" stroke="#B8852E" stroke-width="2"/>
      <line x1="0" y1="30" x2="90" y2="30" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="60" x2="90" y2="60" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="90" x2="90" y2="90" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="120" x2="90" y2="120" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="150" x2="90" y2="150" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="180" x2="90" y2="180" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="210" x2="90" y2="210" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
    </g>
    <g transform="translate(610,220)">
      <rect width="90" height="220" rx="8" fill="url(#insul)" stroke="#B8852E" stroke-width="2"/>
      <line x1="0" y1="40" x2="90" y2="40" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="80" x2="90" y2="80" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="120" x2="90" y2="120" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="160" x2="90" y2="160" stroke="#B8852E" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- Floor -->
  <rect y="500" width="900" height="200" fill="#8B6F47"/>
  <line x1="0" y1="520" x2="900" y2="520" stroke="#6E4E26" stroke-width="2"/>
  <line x1="0" y1="560" x2="900" y2="560" stroke="#6E4E26" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="600" x2="900" y2="600" stroke="#6E4E26" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="640" x2="900" y2="640" stroke="#6E4E26" stroke-width="1" opacity="0.5"/>

  <!-- Worker hand placing insulation (silhouette) -->
  <g transform="translate(720,330)" opacity="0.85">
    <circle cx="20" cy="0" r="22" fill="#F5D6B5"/>
    <rect x="0" y="20" width="40" height="60" rx="10" fill="#06B6A4"/>
    <rect x="35" y="25" width="50" height="14" rx="6" fill="#F5D6B5"/>
  </g>
</svg>
