<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD6B8"/>
      <stop offset="100%" stop-color="#F2A480"/>
    </linearGradient>
    <linearGradient id="facadeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E2C8"/>
      <stop offset="100%" stop-color="#D6BB97"/>
    </linearGradient>
    <linearGradient id="roofF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#384450"/>
      <stop offset="100%" stop-color="#1F2D3D"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#skyF)"/>
  <!-- Sun glow -->
  <circle cx="780" cy="180" r="80" fill="#FFE2B0" opacity="0.55"/>
  <!-- Ground -->
  <rect y="620" width="900" height="80" fill="#7A8A66"/>
  <!-- Driveway -->
  <polygon points="350,700 380,560 580,560 620,700" fill="#8C8377"/>
  <!-- Facade body -->
  <rect x="120" y="200" width="660" height="420" fill="url(#facadeG)"/>
  <!-- Stone base -->
  <rect x="120" y="540" width="660" height="80" fill="#A38C6B"/>
  <g opacity="0.3">
    <line x1="180" y1="540" x2="180" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="260" y1="540" x2="260" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="340" y1="540" x2="340" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="420" y1="540" x2="420" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="500" y1="540" x2="500" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="580" y1="540" x2="580" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="660" y1="540" x2="660" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="740" y1="540" x2="740" y2="620" stroke="#6B5B3F" stroke-width="2"/>
    <line x1="120" y1="580" x2="780" y2="580" stroke="#6B5B3F" stroke-width="2"/>
  </g>
  <!-- Roof -->
  <polygon points="100,200 450,80 800,200" fill="url(#roofF)"/>
  <polygon points="100,200 100,220 800,220 800,200" fill="#7E5847"/>

  <!-- Windows row 1 (1st floor) -->
  <g>
    <rect x="180" y="260" width="100" height="140" fill="#2C3E50"/>
    <rect x="190" y="270" width="35" height="60" fill="#FFD68A"/>
    <rect x="235" y="270" width="35" height="60" fill="#FFD68A"/>
    <rect x="190" y="335" width="35" height="55" fill="#FFD68A"/>
    <rect x="235" y="335" width="35" height="55" fill="#FFD68A"/>

    <rect x="400" y="260" width="100" height="140" fill="#2C3E50"/>
    <rect x="410" y="270" width="35" height="60" fill="#FFD68A"/>
    <rect x="455" y="270" width="35" height="60" fill="#FFD68A"/>
    <rect x="410" y="335" width="35" height="55" fill="#FFD68A"/>
    <rect x="455" y="335" width="35" height="55" fill="#FFD68A"/>

    <rect x="620" y="260" width="100" height="140" fill="#2C3E50"/>
    <rect x="630" y="270" width="35" height="60" fill="#FFD68A"/>
    <rect x="675" y="270" width="35" height="60" fill="#FFD68A"/>
    <rect x="630" y="335" width="35" height="55" fill="#FFD68A"/>
    <rect x="675" y="335" width="35" height="55" fill="#FFD68A"/>
  </g>

  <!-- Ground floor: door + 2 windows -->
  <g>
    <rect x="180" y="430" width="100" height="110" fill="#2C3E50"/>
    <rect x="190" y="440" width="35" height="45" fill="#FFD68A"/>
    <rect x="235" y="440" width="35" height="45" fill="#FFD68A"/>
    <rect x="190" y="490" width="35" height="45" fill="#FFD68A"/>
    <rect x="235" y="490" width="35" height="45" fill="#FFD68A"/>

    <!-- Door -->
    <rect x="420" y="420" width="60" height="120" fill="#1F2D3D"/>
    <rect x="430" y="430" width="40" height="50" fill="#06B6A4" opacity="0.6"/>
    <circle cx="470" cy="490" r="3" fill="#FFD68A"/>
    <!-- Steps -->
    <rect x="400" y="540" width="100" height="6" fill="#9C8E72"/>
    <rect x="395" y="546" width="110" height="6" fill="#A89978"/>

    <rect x="620" y="430" width="100" height="110" fill="#2C3E50"/>
    <rect x="630" y="440" width="35" height="45" fill="#FFD68A"/>
    <rect x="675" y="440" width="35" height="45" fill="#FFD68A"/>
    <rect x="630" y="490" width="35" height="45" fill="#FFD68A"/>
    <rect x="675" y="490" width="35" height="45" fill="#FFD68A"/>
  </g>

  <!-- Shutters -->
  <g fill="#506B47">
    <rect x="160" y="260" width="14" height="140"/>
    <rect x="286" y="260" width="14" height="140"/>
    <rect x="380" y="260" width="14" height="140"/>
    <rect x="506" y="260" width="14" height="140"/>
    <rect x="600" y="260" width="14" height="140"/>
    <rect x="726" y="260" width="14" height="140"/>
  </g>

  <!-- Plants -->
  <g>
    <ellipse cx="150" cy="615" rx="22" ry="8" fill="#3A5E2A"/>
    <ellipse cx="760" cy="615" rx="22" ry="8" fill="#3A5E2A"/>
    <ellipse cx="450" cy="618" rx="20" ry="6" fill="#3A5E2A"/>
  </g>
</svg>
