<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#C9E5F2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F1E5C"/>
    </linearGradient>
    <linearGradient id="roof2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C4A3A"/>
      <stop offset="100%" stop-color="#5E2D24"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#sky2)"/>

  <!-- Clouds -->
  <ellipse cx="180" cy="120" rx="80" ry="22" fill="#fff" opacity="0.8"/>
  <ellipse cx="220" cy="140" rx="70" ry="18" fill="#fff" opacity="0.7"/>
  <ellipse cx="700" cy="90" rx="100" ry="24" fill="#fff" opacity="0.7"/>
  <ellipse cx="750" cy="110" rx="80" ry="20" fill="#fff" opacity="0.6"/>

  <!-- Sun -->
  <circle cx="800" cy="200" r="60" fill="#FFE680" opacity="0.9"/>
  <circle cx="800" cy="200" r="35" fill="#FFC547"/>

  <!-- Roof slope (3D effect) -->
  <polygon points="60,560 60,700 840,700 840,420 760,400 100,400 60,420" fill="url(#roof2)"/>
  <polygon points="60,420 100,400 760,400 840,420 760,440 140,440 60,440" fill="#A55B47"/>

  <!-- Tiles texture -->
  <g opacity="0.3">
    <line x1="100" y1="450" x2="800" y2="450" stroke="#3E1E18" stroke-width="1"/>
    <line x1="100" y1="480" x2="800" y2="480" stroke="#3E1E18" stroke-width="1"/>
    <line x1="100" y1="510" x2="800" y2="510" stroke="#3E1E18" stroke-width="1"/>
    <line x1="100" y1="540" x2="800" y2="540" stroke="#3E1E18" stroke-width="1"/>
    <line x1="100" y1="570" x2="800" y2="570" stroke="#3E1E18" stroke-width="1"/>
    <line x1="100" y1="600" x2="800" y2="600" stroke="#3E1E18" stroke-width="1"/>
    <line x1="100" y1="630" x2="800" y2="630" stroke="#3E1E18" stroke-width="1"/>
    <line x1="100" y1="660" x2="800" y2="660" stroke="#3E1E18" stroke-width="1"/>
  </g>

  <!-- Solar panels grid (perspective) -->
  <g transform="translate(140,460)">
    <!-- Row 1 -->
    <g>
      <polygon points="0,0 130,0 140,180 -10,180" fill="url(#panel)" stroke="#1A2B5E" stroke-width="2"/>
      <line x1="3" y1="0" x2="-1" y2="60" stroke="#3B5BB5" stroke-width="0.5" opacity="0.5"/>
      <line x1="33" y1="0" x2="32" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="65" y1="0" x2="65" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="97" y1="0" x2="98" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-7" y1="60" x2="135" y2="60" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-9" y1="120" x2="137" y2="120" stroke="#3B5BB5" stroke-width="0.8"/>
    </g>
    <g transform="translate(160,0)">
      <polygon points="0,0 130,0 140,180 -10,180" fill="url(#panel)" stroke="#1A2B5E" stroke-width="2"/>
      <line x1="33" y1="0" x2="32" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="65" y1="0" x2="65" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="97" y1="0" x2="98" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-7" y1="60" x2="135" y2="60" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-9" y1="120" x2="137" y2="120" stroke="#3B5BB5" stroke-width="0.8"/>
    </g>
    <g transform="translate(320,0)">
      <polygon points="0,0 130,0 140,180 -10,180" fill="url(#panel)" stroke="#1A2B5E" stroke-width="2"/>
      <line x1="33" y1="0" x2="32" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="65" y1="0" x2="65" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="97" y1="0" x2="98" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-7" y1="60" x2="135" y2="60" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-9" y1="120" x2="137" y2="120" stroke="#3B5BB5" stroke-width="0.8"/>
    </g>
    <g transform="translate(480,0)">
      <polygon points="0,0 130,0 140,180 -10,180" fill="url(#panel)" stroke="#1A2B5E" stroke-width="2"/>
      <line x1="33" y1="0" x2="32" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="65" y1="0" x2="65" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="97" y1="0" x2="98" y2="180" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-7" y1="60" x2="135" y2="60" stroke="#3B5BB5" stroke-width="0.8"/>
      <line x1="-9" y1="120" x2="137" y2="120" stroke="#3B5BB5" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Highlight reflection -->
  <polygon points="200,460 350,460 360,500 210,500" fill="#fff" opacity="0.15"/>
  <polygon points="500,460 650,460 660,500 510,500" fill="#fff" opacity="0.15"/>
</svg>
